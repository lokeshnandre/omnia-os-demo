<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060C1A;--surface:#0D1526;--card:#141F33;--card2:#1A2640;
  --accent:#00D4FF;--accent2:#7C3AED;--green:#10B981;--red:#EF4444;
  --gold:#F59E0B;--orange:#F97316;--muted:#94A3B8;--text:#E2E8F0;
  --border:#1E3A5F;--glow:rgba(0,212,255,0.15);
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.logo{font-size:20px;font-weight:800;letter-spacing:2px;color:var(--text)}
.logo span{color:var(--accent)}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-top:1px}
.live-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:4px 10px;border:1px solid var(--border);border-radius:20px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── NAV TABS ── */
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.nav-tab{padding:12px 16px;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-left:none;border-right:none;border-top:none;transition:all .2s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── HERO SECTION ── */
.hero{background:linear-gradient(135deg,var(--surface) 0%,rgba(0,212,255,0.03) 100%);border-bottom:1px solid var(--border);padding:32px 24px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;max-width:1200px;margin:0 auto}
.hero-stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;position:relative;overflow:hidden}
.hero-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.hs-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
.hs-value{font-size:28px;font-weight:800;margin:6px 0 2px;color:var(--accent)}
.hs-sub{font-size:11px;color:var(--muted)}

/* ── MAIN LAYOUT ── */
.main{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 360px;gap:20px}
.content{display:flex;flex-direction:column;gap:16px}
.sidebar{display:flex;flex-direction:column;gap:16px}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.card-header{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-header span{font-size:16px}

/* ── STATUS ── */
.status-box{border-radius:8px;padding:16px;border:2px solid var(--border);transition:all .4s}
.status-box.valid{border-color:var(--green);background:rgba(16,185,129,.06)}
.status-box.invalid{border-color:var(--red);background:rgba(239,68,68,.06)}
.status-box.pending{border-color:var(--gold);background:rgba(245,158,11,.04)}
.status-badge{font-size:22px;font-weight:900;letter-spacing:3px}
.status-badge.valid{color:var(--green)}
.status-badge.invalid{color:var(--red)}
.status-badge.pending{color:var(--gold)}
.status-reason{font-size:11px;color:var(--muted);font-family:monospace;margin-top:4px}

/* ── DATA GRID ── */
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.di{background:var(--card2);border-radius:6px;padding:10px 12px;border:1px solid var(--border)}
.dl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.dv{font-size:13px;font-family:monospace;margin-top:3px;color:var(--text)}

/* ── MAP ── */
#map{height:240px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}

/* ── TAMPER TESTS ── */
.test-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--card2);border-radius:6px;margin-bottom:5px;cursor:pointer;border:1px solid transparent;transition:all .2s}
.test-row:hover{border-color:var(--accent);transform:translateX(2px)}
.tl{font-size:12px;font-weight:600;color:var(--text)}
.td{font-size:10px;color:var(--muted);margin-top:1px}
.tb{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;font-family:monospace;white-space:nowrap}
.tb.pass{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.tb.fail{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.tb.run{background:rgba(245,158,11,.15);color:var(--gold);border:1px solid rgba(245,158,11,.3)}
.tb.pend{background:rgba(148,163,184,.08);color:var(--muted);border:1px solid var(--border)}

/* ── BUTTONS ── */
.btn{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all .2s;background:transparent;color:var(--text);margin-bottom:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0099BB);color:#000;border-color:var(--accent);font-weight:800}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-purple{background:linear-gradient(135deg,var(--accent2),#5B21B6);color:#fff;border-color:var(--accent2)}
.btn-purple:hover{opacity:.9}

/* ── WORKER CARD (D-HITL) ── */
.worker-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;transition:all .3s;cursor:pointer}
.worker-card:hover{border-color:var(--accent);background:rgba(0,212,255,.04)}
.wc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wc-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
.wc-name{font-size:13px;font-weight:600;color:var(--text)}
.wc-role{font-size:11px;color:var(--muted)}
.wc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.wc-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-hw{background:rgba(0,212,255,.12);color:var(--accent);border:1px solid rgba(0,212,255,.3)}
.badge-pq{background:rgba(124,58,237,.12);color:#A78BFA;border:1px solid rgba(124,58,237,.3)}
.badge-ai{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.badge-bot{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.wc-score{display:flex;align-items:center;gap:8px}
.score-label{font-size:10px;color:var(--muted)}
.score-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px;transition:width .8s ease}
.score-num{font-size:12px;font-weight:700;font-family:monospace}

/* ── TASK CARD ── */
.task-card{background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(0,212,255,.05));border:1px solid rgba(124,58,237,.3);border-radius:10px;padding:18px;margin-bottom:12px}
.task-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.task-client{font-size:11px;color:var(--accent);margin-bottom:12px}
.task-req{background:rgba(0,0,0,.3);border-radius:6px;padding:10px;font-size:11px;color:var(--muted);margin-bottom:12px;border:1px solid var(--border)}
.task-req span{color:var(--green);font-weight:600}
.task-pay{font-size:24px;font-weight:800;color:var(--green);margin-bottom:4px}
.task-pay-sub{font-size:11px;color:var(--muted);margin-bottom:14px}

.sign-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.4)}
.sign-btn::before{content:'🔐 ';font-size:16px}

/* ── LEDGER ── */
.ledger-item{font-size:11px;padding:8px 10px;border-radius:6px;background:var(--card2);margin-bottom:5px;border-left:3px solid;font-family:monospace}
.ledger-item.ok{border-color:var(--green)}
.ledger-item.err{border-color:var(--red)}
.ledger-item.pq{border-color:#A78BFA}
.li-hash{color:var(--accent);font-size:10px}
.li-event{color:var(--text);display:block;margin:2px 0;font-size:11px}
.li-meta{color:var(--muted);font-size:10px}

/* ── MIDDLEMAN TABLE ── */
.mm-row{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.mm-row:last-child{border-bottom:none}
.mm-row.header{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding-bottom:8px}
.mm-name{color:var(--text)}
.mm-cut{color:var(--red);font-weight:700}
.mm-fee{color:var(--green);font-weight:700}
.mm-save{color:var(--gold);font-size:11px}

/* ── TERMINAL ── */
.terminal{background:#000;border:1px solid var(--border);border-radius:8px;padding:14px;font-family:'Courier New',monospace;font-size:11px;max-height:160px;overflow-y:auto}
.terminal::-webkit-scrollbar{width:4px}
.terminal::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.t-line{margin-bottom:3px;line-height:1.5}
.t-ok{color:var(--green)}
.t-err{color:var(--red)}
.t-inf{color:var(--accent)}
.t-pq{color:#A78BFA}
.t-muted{color:var(--muted)}

/* ── HANDSHAKE STEPS ── */
.hs-step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.hs-step:last-child{border-bottom:none}
.hs-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border:1px solid var(--border);color:var(--muted)}
.hs-num.done{background:rgba(16,185,129,.15);border-color:var(--green);color:var(--green)}
.hs-num.active{background:rgba(0,212,255,.15);border-color:var(--accent);color:var(--accent)}
.hs-text{font-size:11px;color:var(--muted);padding-top:3px}
.hs-text b{color:var(--text);font-size:12px;display:block;margin-bottom:2px}
.hs-result{font-family:monospace;font-size:10px;margin-top:4px;padding:3px 8px;border-radius:4px;background:rgba(16,185,129,.08);color:var(--green);border:1px solid rgba(16,185,129,.2)}

/* ── SECTION TITLE ── */
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}

@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:1fr 1fr}
  .sidebar{order:-1}
}
@media(max-width:560px){
  .hero-grid{grid-template-columns:1fr}
  .data-grid{grid-template-columns:1fr}
}

function initMap(){
  if(map) return;

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
}

function updateMap(lat,lng,valid){
  if(!map) return;
  const c = valid?'#10B981':'#EF4444';
  const icon = L.divIcon({html:`<div style="width:14px;height:14px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 0 8px ${c}"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
  if(!marker) marker=L.marker([lat,lng],{icon}).addTo(map);
  else{marker.setLatLng([lat,lng]);marker.setIcon(icon)}
  trail.push([lat,lng]);
  if(trail.length>50) trail.shift();
  if(trailLine) map.removeLayer(trailLine);
  trailLine=L.polyline(trail,{color:c,weight:2,opacity:.6}).addTo(map);

function addTermLine(msg,type='inf'){
  const t=new Date().toTimeString().slice(0,8);
  termLines.push({msg:`[${t}] ${msg}`,type});

}

function renderTerminal(){
  const el=document.getElementById('terminal');
  if(!el) return;
  el.innerHTML=termLines.map(l=>`<div class="t-line t-${l.type}">${l.msg}</div>`).join('');
  el.scrollTop=el.scrollHeight;
}

function buildHandshakeSteps(active){
  const d=TABS[currentTab];

    const done=i<active,act=i===active;
    return `<div class="hs-step">
      <div class="hs-num ${done?'done':act?'active':''}">${done?'✓':i+1}</div>
      <div style="flex:1">
        <div class="hs-text"><b>${s.l}</b>${s.s}</div>
        ${done||act?`<div class="hs-result">${s.r}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function setStatus(valid,reason,type){
  const box=document.getElementById('statusBox');
  const badge=document.getElementById('statusBadge');
  const r=document.getElementById('statusReason');
  if(!box) return;
  const cls=valid?'valid':'invalid';
  box.className=`status-box ${cls}`;
  badge.className=`status-badge ${cls}`;
  badge.textContent=valid?'VERIFIED ✓':'BLOCKED ✗';
  r.textContent=reason;
}

function simulate(){
  const lat=45.0703+(Math.random()-.5)*.008;
  const lng=7.6869+(Math.random()-.5)*.008;
  const nonce=(Math.floor(Math.random()*65536)).toString(16).padStart(8,'0');
  const score=Math.floor(90+Math.random()*10);
  const el=id=>document.getElementById(id);
  if(el('dLat')) el('dLat').textContent=lat.toFixed(6);
  if(el('dLng')) el('dLng').textContent=lng.toFixed(6);
  if(el('dNonce')) el('dNonce').textContent='0x'+nonce;
  if(el('dScore')) el('dScore').textContent=score+'%';
  if(map) updateMap(lat,lng,true);
  setStatus(true,'ECDSA P-256 · ML-DSA · EURC payment queued');
  addTermLine(`Packet verified: lat=${lat.toFixed(4)} score=${score}%`,'ok');
}

async function runHandshake(){
  const d=TABS[currentTab];
  if(!d.handshake||!d.handshake.length) return;
  hsStep=0;
  addTermLine('Hardware handshake initiated...','inf');
  const update=()=>{
    const el=document.getElementById('hsSteps');
    if(el) el.innerHTML=buildHandshakeSteps(hsStep);
    if(hsStep===0) addTermLine('Titan M2 TEE initialized — key loaded','pq');
    if(hsStep===1) addTermLine(currentTab==='hitl'?'Tensor TPU liveness: 99.2% HUMAN':'GPS signed at kernel level — unspoofable','ok');
    if(hsStep===2) addTermLine('ML-DSA post-quantum wrap applied (NIST FIPS 204)','pq');
    if(hsStep===3) addTermLine('Attestation packet verified — chain valid','ok');
    if(hsStep===4){
      addTermLine('Payment released — zero commission','ok');
      setStatus(true,'TEE signature valid · ML-DSA verified · payment released');
      simulate();
    }
    hsStep++;
    if(hsStep<=d.handshake.length) setTimeout(update,700);
  };
  update();
}

async function runSingleTest(i){
  testState[i]='run';
  const expected=['pass','pass','pass','pass','pass'];
  renderContent();
  await new Promise(r=>setTimeout(r,600));
  testState[i]=expected[i];
  const labels=['VALID','CERT_CHAIN_INVALID','SIGNATURE_INVALID','REPLAY_DETECTED','SIGNATURE_INVALID'];
  addTermLine(`T${i+1}: ${labels[i]}`,i===0?'ok':'err');
  setStatus(i===0,i===0?'Authentic TEE packet verified':`Attack blocked: ${labels[i]}`);
  renderContent();
}

async function runAllTests(){
  addTermLine('Running T1-T5 Zero-Spoofing suite...','inf');
  for(let i=0;i<5;i++){
    await runSingleTest(i);
    await new Promise(r=>setTimeout(r,300));
  }
  addTermLine('ALL 5 TESTS PASSED ✓ — Zero-Spoofing demo investor-ready','ok');
  addTermLine('Physics cannot be patched. Mathematics over middlemen.','pq');
}
